name: Publish to npm

# npm Trusted Publishing via GitHub OIDC: no NODE_AUTH_TOKEN anywhere.
# `permissions: id-token: write` is the lever — the npm registry verifies the
# GitHub OIDC token against the publisher you configured on npmjs.com and
# authorizes the publish (SLSA provenance is generated as part of it).
#
# One-time npm-side setup (cannot be done from this repo):
#   1. https://www.npmjs.com/settings/<user>/access-tokens → Enable Trusted
#      Publishing.
#   2. Add publisher → GitHub → repo `SiriLee/dsh-rewind`, branch `main`
#      (or environment `npm` — match the `environment` below).
#   3. From then on, push a `v<version>` tag (or run this workflow manually)
#      and the publish below runs with OIDC credentials only.
#
# Requires npm >= 11.5.1: Node 24 ships it natively (Node 22's npm 10.x
# cannot self-upgrade reliably), so this job pins Node 24.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write # auto-create the GitHub Release
  id-token: write # OIDC trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      # The package page appears once the first publish lands; until then this
      # URL 404s, which is expected (the workflow still runs).
      url: https://www.npmjs.com/package/dsh-rewind-plugin
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm >= 11.5.1
        run: |
          set -euo pipefail
          ver=$(npm --version)
          echo "npm: $ver"
          if [ "$(printf '%s\n' '11.5.1' "$ver" | sort -V | head -1)" != '11.5.1' ]; then
            echo "::error::npm $ver < 11.5.1 — OIDC publish needs >= 11.5.1"
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' (=$TAG) does not match package.json version '$PKG'"
            exit 1
          fi
          echo "Tag and package.json version both = $PKG"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-host.mjs

      # Idempotency guard: makes workflow_dispatch re-runs (and tag pushes of
      # an already-published version) safe.
      - name: Skip publish if version already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} already on npm — skipping publish step."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # No --provenance flag, no NODE_AUTH_TOKEN — OIDC handles both.
      - name: Publish to npm via OIDC
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --access public

      - name: Create GitHub Release (if missing)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — leaving it alone."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${{ github.repository }}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi
