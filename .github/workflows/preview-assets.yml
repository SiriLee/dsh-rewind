name: Preview assets

on:
  push:
    branches: [main]
    paths:
      - 'docs/preview*.svg'
  pull_request:
    paths:
      - 'docs/preview*.svg'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/verify-preview-assets.mjs
